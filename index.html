

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Borderline</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #f5f7fa;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Globe logo */
    .globe-logo {
      width: min(80vw, 400px);
      height: auto;

      /* Floating animation */
      animation: float 5s ease-in-out infinite;
    }

    /* Smooth up-and-down movement */
    @keyframes float {
      0% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-20px);
      }

      100% {
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .globe-logo {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <img
    src="Untitled 2.png"
    alt="Borderline Globe Logo"
    class="globe-logo"
  >

</body>
</html>
