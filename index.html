
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Borderline</title>

  <style>

    /* MAIN WEBPAGE */
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background-color: #f5f7fa;
      font-family: Arial, sans-serif;
    }

    /* MAIN CONTENT */
    .main-container {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* LOGO POSITION */
    .game-header {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: min(65vw, 350px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* FLOATING GLOBE */
    .globe-logo {
      width: 100%;
      height: auto;
      display: block;

      animation: float 5s ease-in-out infinite;
    }

    /* GLOBE FLOATING ANIMATION */
    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    /* START BUTTON AND COUNTRY TEXT AREA */
    .start-area {
      position: absolute;
      top: 75%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: min(90vw, 360px);
      height: 120px;
    }

    /* START BUTTON */
    .image-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: 200px;
      height: 90px;

      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;

      display: flex;
      justify-content: center;
      align-items: center;

      transition: opacity 0.3s ease;
    }

    /* START2.PNG IMAGE */
    .image-button img {
      width: 65px;
      height: auto;
      display: block;

      transform: rotate(-90deg);
      transition: transform 0.2s ease;
    }

    /* BUTTON HOVER ANIMATION */
    .image-button:hover img {
      transform: rotate(-90deg) scale(1.1);
    }

    /* HIDE START BUTTON */
    .image-button.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* COUNTRY ANNOUNCEMENT */
    .country-display {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: 100%;
      text-align: center;

      opacity: 0;
      visibility: hidden;

      transition: opacity 0.5s ease;
    }

    /* SHOW COUNTRY ANNOUNCEMENT */
    .country-display.visible {
      opacity: 1;
      visibility: visible;
    }

    /* INTRODUCTORY TEXT */
    .country-display h2 {
      font-size: clamp(18px, 3vw, 26px);
      color: #222;
      margin: 0;
      white-space: nowrap;
    }

    /* COUNTRY NAME */
    #countryName {
      color: #00b85b;
      font-size: clamp(26px, 4vw, 36px);
      margin: 12px 0 0;
    }

    /* COUNTRY REVEAL ANIMATION */
    #countryName.reveal {
      animation: countryPop 0.5s ease-out;
    }

    @keyframes countryPop {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ACCESSIBILITY */
    @media (prefers-reduced-motion: reduce) {
      .globe-logo,
      #countryName.reveal {
        animation: none;
      }

      .image-button,
      .image-button img,
      .country-display {
        transition: none;
      }
    }

  </style>
</head>

<body>

  <main class="main-container">

    <!-- FLOATING BORDERLINE LOGO -->
    <div class="game-header">

      <img
        src="Untitled%202.png"
        alt="Borderline Globe Logo"
        class="globe-logo"
      >

    </div>

    <!-- START BUTTON AND COUNTRY ANNOUNCEMENT -->
    <div class="start-area">

      <!-- START BUTTON -->
      <button
        class="image-button"
        id="startButton"
        type="button"
        aria-label="Start Game"
      >
        <img
          src="Start2.png"
          alt=""
        >
      </button>

      <!-- COUNTRY ANNOUNCEMENT -->
      <div
        class="country-display"
        id="countryDisplay"
        aria-live="polite"
      >
        <h2>Today's country is...</h2>
        <h1 id="countryName"></h1>
      </div>

    </div>

  </main>

  <!-- JAVASCRIPT -->
  <script>

    // Find the HTML elements
    const startButton =
      document.getElementById("startButton");

    const countryDisplay =
      document.getElementById("countryDisplay");

    const countryName =
      document.getElementById("countryName");

    // Start game when button is clicked
    startButton.addEventListener("click", function() {

      // Prevent multiple clicks
      startButton.disabled = true;

      // Hide Start button
      startButton.classList.add("hidden");

      // Display introductory text
      countryDisplay.classList.add("visible");

      // Reveal country after one second
      setTimeout(function() {

        countryName.textContent = "New Zealand";

        countryName.classList.add("reveal");

      }, 1000);

    });

  </script>

</body>
</html>
