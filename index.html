
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borderline</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
@font-face {
  font-family: Sigher;
  src: url("Sigher.woff2") format("woff2");
  font-display: swap;
}

:root {
  --green: #00b85b;
  --bg: #f5f7fa;
  --ink: #252525;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: Arial, sans-serif;
  color: var(--ink);
}

button {
  font: inherit;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

/* SCREENS */

.screen {
  position: absolute;
  inset: 0;
  background: var(--bg);
  height: 100dvh;
  overflow: hidden;
  transition: transform 1.1s ease, opacity 1.1s ease;
}

.screen.active {
  transform: translateY(0);
  opacity: 1;
  pointer-events: auto;
}

.screen.offscreen {
  transform: translateY(110%);
  opacity: 0;
  pointer-events: none;
}

.screen.leave {
  transform: translateY(-110%);
  opacity: 0;
  pointer-events: none;
}

#home { z-index: 3; }
#round1 { z-index: 2; }
#round2 { z-index: 1; }

/* HOME */

.home-logo {
  position: absolute;
  top: 38%;
  left: 50%;
  width: min(65vw, 350px);
  transform: translate(-50%, -50%);
}

.home-logo img {
  width: 100%;
  display: block;
  animation: float 5s ease-in-out infinite;
}

@keyframes float {
  50% { transform: translateY(-15px); }
}

.start-area {
  position: absolute;
  top: 75%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(90vw, 360px);
  height: 120px;
}

.start-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border: 0;
  background: transparent;
  width: 200px;
  height: 90px;
  display: grid;
  place-items: center;
  transition: opacity .3s;
}

.start-btn img {
  width: 65px;
  transform: rotate(-90deg);
  transition: transform .2s;
}

.start-btn:hover img {
  transform: rotate(-90deg) scale(1.1);
}

.start-btn.hidden {
  opacity: 0;
  pointer-events: none;
}

.country-reveal {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity .4s;
}

.country-reveal.visible {
  opacity: 1;
  visibility: visible;
}

.country-reveal h2 {
  font-size: clamp(18px, 3vw, 26px);
  margin: 0;
}

.country-reveal h1 {
  font-size: clamp(26px, 4vw, 36px);
  margin: 12px 0 0;
  color: var(--green);
}

/* ROUNDS */

.round-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.round-layout {
  width: min(100%, 760px);
  max-height: 100%;
  overflow-y: auto;
  scrollbar-width: thin;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 2px 0 10px;
}

.round-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(10px, 3vw, 28px);
  width: 100%;
  flex-shrink: 0;
}

.round-header img {
  width: clamp(48px, 9vw, 82px);
  height: clamp(48px, 9vw, 82px);
  object-fit: contain;
  animation: float 5s ease-in-out infinite;
}

.round-header img:last-child {
  animation-delay: -2.5s;
}

.round-heading { text-align: center; }

.country-title, .round-number {
  font-family: Sigher, Arial, sans-serif;
}

.country-title {
  font-size: clamp(24px, 5vw, 40px);
  color: #008c46;
}

.round-number {
  font-size: clamp(18px, 3vw, 26px);
  margin-top: 4px;
}

/* ROUND 1 QUESTIONS */

.panel {
  width: 100%;
  background: white;
  border: 2px solid #343434;
  border-radius: 12px;
  padding: clamp(16px, 4vw, 30px);
  display: flex;
  flex-direction: column;
  gap: 18px;
  flex-shrink: 0;
}

.question {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.question label {
  font-size: clamp(15px, 2.3vw, 20px);
  font-weight: 600;
}

.question input {
  height: 46px;
  padding: 0 14px;
  font-size: 18px;
  border: 2px solid #c4cbd1;
  border-radius: 8px;
  background: var(--bg);
  width: 100%;
}

.question input:focus {
  outline: none;
  border-color: var(--green);
}

.answer-result {
  display: none;
  background: #eaf8ef;
  border-left: 4px solid var(--green);
  border-radius: 6px;
  padding: 10px 12px;
  line-height: 1.5;
}

.answer-result.visible { display: block; }

/* BUTTONS */

.primary, .secondary {
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
  padding: 12px 22px;
}

.primary {
  border: 0;
  background: var(--green);
  color: white;
}

.secondary {
  border: 2px solid #abb6be;
  background: white;
  color: #333;
}

.secondary.selected {
  background: #e2f8eb;
  border-color: var(--green);
  color: #008c46;
}

.panel > .primary { align-self: center; }
.continue { display: none; }
.continue.visible { display: block; }

/* POINTS */

.score {
  width: 100%;
  text-align: center;
  flex-shrink: 0;
}

.score-label {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.score-track {
  height: 30px;
  background: #e1e7ec;
  border: 2px solid #343434;
  border-radius: 8px;
  overflow: hidden;
}

.score-fill {
  width: 0;
  height: 100%;
  background: var(--green);
  transition: width 1s ease;
}

.score-scale {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  margin-top: 5px;
}

.score-note {
  font-size: 15px;
  min-height: 20px;
  margin-top: 10px;
}

/* ROUND 2 MAP */

.map-instructions {
  font-size: clamp(15px, 2.3vw, 20px);
  font-weight: 600;
  text-align: center;
  margin: 0;
}

.map-frame {
  position: relative;
  width: 100%;
  height: clamp(270px, 46vh, 440px);
  min-height: 270px;
  flex-shrink: 0;
  border: 2px solid #343434;
  border-radius: 12px;
  overflow: hidden;
  background: #b5cbd5;
}

#map {
  width: 100%;
  height: 100%;
  background: #b5cbd5;
}

#drawCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 600;
  display: none;
  touch-action: none;
  cursor: crosshair;
}

#drawCanvas.enabled { display: block; }

.map-status {
  position: absolute;
  top: 9px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 700;
  pointer-events: none;
  max-width: 92%;
  text-align: center;
}

.map-status span {
  display: inline-block;
  background: #fffffff0;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  box-shadow: 0 2px 8px #0002;
}

.map-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 9px;
}

.result {
  display: none;
  width: 100%;
  padding: 14px;
  background: #eaf8ef;
  border: 1px solid #a7dfbb;
  border-radius: 10px;
  text-align: center;
  line-height: 1.7;
}

.result.visible { display: block; }

.total {
  font-size: 21px;
  font-weight: bold;
  color: #008c46;
}

.credit {
  font-size: 11px;
  color: #64717b;
  text-align: center;
}

@media (max-width: 500px) {
  .round-screen { padding: 10px; }
  .round-layout { gap: 11px; }
  .panel { padding: 16px; }

  .map-actions button {
    font-size: 13px;
    padding: 10px 12px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .home-logo img, .round-header img {
    animation: none;
  }

  .screen, .score-fill {
    transition: none;
  }
}
</style>
</head>

<body>

<!-- HOME SCREEN -->

<main id="home" class="screen active">
  <div class="home-logo">
    <img src="Untitled%202.png" alt="Borderline logo">
  </div>

  <div class="start-area">
    <button id="start" class="start-btn" aria-label="Start game">
      <img src="Start2.png" alt="">
    </button>

    <div id="reveal" class="country-reveal">
      <h2>Today's country is...</h2>
      <h1 id="revealName"></h1>
    </div>
  </div>
</main>

<!-- ROUND ONE -->

<section id="round1" class="screen offscreen round-screen">
  <div class="round-layout">

    <header class="round-header">
      <img src="Untitled%201.png" alt="">

      <div class="round-heading">
        <div class="country-title country-name"></div>
        <div class="round-number">Round 1</div>
      </div>

      <img src="Untitled%201.png" alt="">
    </header>

    <form id="questions" class="panel">

      <div class="question">
        <label id="qGDP" for="gdp"></label>
        <input id="gdp" type="number" min="0" step="any"
          required placeholder="Type your answer here...">
        <div class="answer-result" id="aGDP"></div>
      </div>

      <div class="question">
        <label id="qPopulation" for="population"></label>
        <input id="population" type="number" min="0" step="any"
          required placeholder="Type your answer here...">
        <div class="answer-result" id="aPopulation"></div>
      </div>

      <div class="question">
        <label id="qCoast" for="coast"></label>
        <input id="coast" type="number" min="0" step="any"
          required placeholder="Type your answer here...">
        <div class="answer-result" id="aCoast"></div>
      </div>

      <button class="primary" type="submit">
        Submit Answers
      </button>

    </form>

    <div class="score">
      <div id="score1Label" class="score-label">
        0 / 1000 Points
      </div>

      <div class="score-track">
        <div id="score1Fill" class="score-fill"></div>
      </div>

      <div class="score-scale">
        <span>0</span><span>1000</span>
      </div>

      <div id="score1Note" class="score-note"></div>
    </div>

    <button id="continue" class="primary continue">
      Continue to Round 2
    </button>

  </div>
</section>

<!-- ROUND TWO -->

<section id="round2" class="screen offscreen round-screen">
  <div class="round-layout">

    <header class="round-header">
      <img src="Untitled%201.png" alt="">

      <div class="round-heading">
        <div class="country-title country-name"></div>
        <div class="round-number">Round 2</div>
      </div>

      <img src="Untitled%201.png" alt="">
    </header>

    <p id="instructions" class="map-instructions"></p>

    <div class="map-frame">
      <div id="map"></div>
      <canvas id="drawCanvas"></canvas>

      <div class="map-status">
        <span id="mapStatus">Preparing map...</span>
      </div>
    </div>

    <div class="map-actions">
      <button id="navigate" class="secondary selected">
        Navigate
      </button>

      <button id="draw" class="secondary">Draw</button>
      <button id="clear" class="secondary">Clear</button>
      <button id="reset" class="secondary">Reset Map</button>

      <button id="submitBorder" class="primary" disabled>
        Submit Border
      </button>
    </div>

    <div id="result" class="result">
      <div id="borderResult"></div>
      <div id="total" class="total"></div>
    </div>

    <div class="score">
      <div id="score2Label" class="score-label">
        0 / 1000 Points
      </div>

      <div class="score-track">
        <div id="score2Fill" class="score-fill"></div>
      </div>

      <div class="score-scale">
        <span>0</span><span>1000</span>
      </div>

      <div id="score2Note" class="score-note">
        Find the country, select Draw, and trace its outline.
      </div>
    </div>

    <div class="credit">
      Map imagery © Esri and contributors.
      Country borders: Natural Earth.
    </div>

  </div>
</section>

<script>
"use strict";

/* DAILY COUNTRY */

const country = {
  name: "New Zealand",
  code: "NZL",
  answers: {
    gdp: 260,
    population: 5.3,
    coastline: 15134
  }
};

const el = id => document.getElementById(id);

let round1Score = 0;
let round2Score = 0;

document.querySelectorAll(".country-name").forEach(e => {
  e.textContent = country.name;
});

el("qGDP").textContent =
  `What is the GDP of ${country.name}? (USD billions)`;

el("qPopulation").textContent =
  `What is the population of ${country.name}? (millions)`;

el("qCoast").textContent =
  `How long is the coastline of ${country.name}? (kilometres)`;

el("instructions").textContent =
  `Find ${country.name} on the world map and draw its borders`;

/* SCREEN TRANSITIONS */

function transition(from, to) {
  el(from).classList.remove("active");
  el(from).classList.add("leave");

  el(to).classList.remove("offscreen");
  el(to).classList.add("active");
}

/* START GAME */

el("start").addEventListener("click", () => {
  el("start").disabled = true;
  el("start").classList.add("hidden");
  el("reveal").classList.add("visible");

  setTimeout(() => {
    el("revealName").textContent = country.name;
  }, 1000);

  setTimeout(() => {
    transition("home", "round1");
  }, 2800);
});

/* SCORE ANIMATION */

function scoreAnimation(label, fill, points) {
  el(fill).style.width = points / 10 + "%";

  const start = performance.now();

  function frame(now) {
    const p = Math.min((now - start) / 1000, 1);

    const displayed = Math.round(
      points * (1 - (1 - p) ** 3)
    );

    el(label).textContent =
      `${displayed} / 1000 Points`;

    if (p < 1) requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
}

/* ROUND ONE */

function accuracy(guess, actual) {
  return Math.max(
    0,
    1 - Math.abs(guess - actual) / actual
  );
}

function answer(id, value, unit, points, max) {
  el(id).innerHTML =
    `Correct answer: <strong>${value} ${unit}</strong>` +
    `<div>Points earned: ${points} / ${max}</div>`;

  el(id).classList.add("visible");
}

el("questions").addEventListener("submit", e => {
  e.preventDefault();

  const a = country.answers;

  const g = Math.round(
    accuracy(+el("gdp").value, a.gdp) * 334
  );

  const p = Math.round(
    accuracy(+el("population").value, a.population) * 333
  );

  const c = Math.round(
    accuracy(+el("coast").value, a.coastline) * 333
  );

  round1Score = g + p + c;

  answer("aGDP", a.gdp, "billion USD", g, 334);
  answer("aPopulation", a.population, "million", p, 333);
  answer("aCoast", a.coastline.toLocaleString(), "km", c, 333);

  scoreAnimation("score1Label", "score1Fill", round1Score);

  el("score1Note").textContent =
    `You earned ${round1Score} out of 1000 points in Round 1!`;

  e.target.querySelectorAll("input,button").forEach(x => {
    x.disabled = true;
  });

  el("continue").classList.add("visible");
});

el("continue").addEventListener("click", () => {
  transition("round1", "round2");
  setTimeout(initMap, 1150);
});

/* ROUND TWO MAP */

let map = null;
let boundary = null;
let boundaryReady = false;
let drawMode = false;
let submitted = false;
let isDrawing = false;
let coords = [];
let mapLayer = null;

const canvas = el("drawCanvas");
const ctx = canvas.getContext("2d");

function status(s) {
  el("mapStatus").textContent = s;
}

function submitState() {
  el("submitBorder").disabled =
    !boundaryReady ||
    !drawMode ||
    submitted ||
    isDrawing ||
    coords.length < 10;
}

/* CREATE MAP */

function initMap() {
  if (map) {
    map.invalidateSize();
    return;
  }

  if (!window.L) {
    status("Map library could not load. Refresh to retry.");
    return;
  }

  map = L.map("map", {
    center: [15, 0],
    zoom: 2,
    minZoom: 2,
    maxZoom: 11,
    zoomControl: true,
    worldCopyJump: false
  });

  // Physical geography map without political boundaries.
  const physical = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Physical_Map/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 11,
      maxNativeZoom: 8,
      noWrap: true,
      attribution: "Tiles © Esri"
    }
  );

  // Satellite imagery fallback.
  const imagery = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 11,
      noWrap: true,
      attribution: "Imagery © Esri"
    }
  );

  let failures = 0;

  physical.on("tileerror", () => {
    failures++;

    if (failures >= 2 && mapLayer === physical) {
      map.removeLayer(physical);
      mapLayer = imagery;
      imagery.addTo(map);

      status("Using satellite map fallback. Navigate and draw.");
    }
  });

  mapLayer = physical;
  physical.addTo(map);

  map.on("moveend zoomend", () => {
    if (drawMode && !isDrawing) redraw();
  });

  map.invalidateSize();
  resizeCanvas();

  status("Navigate to the country, then choose Draw.");

  loadBoundary();
}

/* LOAD COUNTRY BORDER FROM TWO SOURCES */

async function loadBoundary() {
  boundaryReady = false;
  submitState();

  const sources = [
    `https://raw.githubusercontent.com/johan/world.geo.json/master/countries/${country.code}.geo.json`,
    `https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries/${country.code}.geo.json`
  ];

  let errorText = "";

  for (const url of sources) {
    const controller = new AbortController();

    const timeout = setTimeout(() => {
      controller.abort();
    }, 12000);

    try {
      const response = await fetch(url, {
        signal: controller.signal,
        cache: "no-store"
      });

      if (!response.ok) {
        throw Error(`HTTP ${response.status}`);
      }

      const data = await response.json();

      if (
        !data.geometry ||
        !["Polygon", "MultiPolygon"].includes(data.geometry.type)
      ) {
        throw Error("Invalid geometry");
      }

      boundary = data;
      boundaryReady = true;
      submitState();

      el("score2Note").textContent =
        "Draw a closed outline to earn up to 1000 points.";

      if (!drawMode) {
        status("Map ready. Navigate to the country, then choose Draw.");
      } else {
        status("Map ready. Finish your drawing and submit.");
      }

      return;

    } catch (err) {
      errorText = err.message;
      console.warn("Boundary source failed", url, err);

    } finally {
      clearTimeout(timeout);
    }
  }

  status("Scoring data unavailable. Refresh to retry.");

  el("score2Note").textContent =
    "Border scoring could not load (" + errorText + ").";
}

/* NAVIGATION AND DRAWING MODES */

function setMode(draw) {
  if (!map || submitted) return;

  drawMode = draw;

  el("draw").classList.toggle("selected", draw);
  el("navigate").classList.toggle("selected", !draw);
  canvas.classList.toggle("enabled", draw);

  if (draw) {
    map.dragging.disable();
    map.scrollWheelZoom.disable();
    map.doubleClickZoom.disable();
    map.touchZoom.disable();

    resizeCanvas();

    status(
      boundaryReady
        ? "Draw a closed outline around the country."
        : "Drawing available; scoring data still loading."
    );

  } else {
    map.dragging.enable();
    map.scrollWheelZoom.enable();
    map.doubleClickZoom.enable();
    map.touchZoom.enable();

    status("Navigate and zoom, then select Draw.");
  }

  submitState();
}

el("navigate").onclick = () => setMode(false);
el("draw").onclick = () => setMode(true);

/* CANVAS */

function resizeCanvas() {
  const r = canvas.getBoundingClientRect();

  if (!r.width || !r.height) return;

  const d = window.devicePixelRatio || 1;

  canvas.width = Math.round(r.width * d);
  canvas.height = Math.round(r.height * d);

  ctx.setTransform(d, 0, 0, d, 0, 0);

  redraw();
}

function point(e) {
  const r = canvas.getBoundingClientRect();

  return {
    x: e.clientX - r.left,
    y: e.clientY - r.top
  };
}

function geo(p) {
  const v = map.containerPointToLatLng(
    L.point(p.x, p.y)
  );

  return [v.lng, v.lat];
}

/* DRAW STORED COORDINATES */

function redraw() {
  const r = canvas.getBoundingClientRect();

  ctx.clearRect(0, 0, r.width, r.height);

  if (!map || coords.length < 2) return;

  ctx.beginPath();

  coords.forEach((c, i) => {
    const p = map.latLngToContainerPoint(
      L.latLng(c[1], c[0])
    );

    if (i === 0) {
      ctx.moveTo(p.x, p.y);
    } else {
      ctx.lineTo(p.x, p.y);
    }
  });

  if (!isDrawing) ctx.closePath();

  ctx.strokeStyle = "#00b85b";
  ctx.lineWidth = 3.5;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.stroke();

  if (!isDrawing) {
    ctx.fillStyle = "rgba(0,184,91,.12)";
    ctx.fill();
  }
}

/* START DRAWING */

canvas.addEventListener("pointerdown", e => {
  if (!drawMode || submitted) return;

  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);

  isDrawing = true;
  coords = [geo(point(e))];

  redraw();
  submitState();
});

/* CONTINUE DRAWING */

canvas.addEventListener("pointermove", e => {
  if (!isDrawing) return;

  e.preventDefault();

  const p = geo(point(e));
  const last = coords[coords.length - 1];

  if (
    Math.hypot(
      p[0] - last[0],
      p[1] - last[1]
    ) > .001
  ) {
    coords.push(p);
    redraw();
  }
});

/* FINISH DRAWING */

function endDrawing() {
  if (!isDrawing) return;

  isDrawing = false;
  redraw();
  submitState();

  status(
    coords.length >= 10
      ? "Drawing complete. Submit or clear to retry."
      : "Draw a longer outline."
  );
}

canvas.addEventListener("pointerup", endDrawing);
canvas.addEventListener("pointercancel", endDrawing);

/* CLEAR */

el("clear").onclick = () => {
  if (submitted) return;

  coords = [];
  isDrawing = false;

  redraw();
  submitState();

  status("Drawing cleared. Try again.");
};

/* RESET MAP */

el("reset").onclick = () => {
  if (!map || submitted) return;

  if (coords.length) {
    coords = [];
    redraw();
    submitState();
  }

  setMode(false);
  map.setView([15, 0], 2);

  status("World map reset. Navigate to the country.");
};

/* GEOGRAPHIC SCORING */

/* Determine whether a point is inside a polygon ring. */

function inRing(point, ring) {
  let inside = false;

  const [x, y] = point;

  for (
    let i = 0, j = ring.length - 1;
    i < ring.length;
    j = i++
  ) {
    const [xi, yi] = ring[i];
    const [xj, yj] = ring[j];

    if (
      (yi > y) !== (yj > y) &&
      x < (xj - xi) * (y - yi) / (yj - yi) + xi
    ) {
      inside = !inside;
    }
  }

  return inside;
}

function inPolygon(point, rings) {
  if (!inRing(point, rings[0])) return false;

  for (let i = 1; i < rings.length; i++) {
    if (inRing(point, rings[i])) return false;
  }

  return true;
}

function inGeometry(point, g) {
  if (g.type === "Polygon") {
    return inPolygon(point, g.coordinates);
  }

  return g.coordinates.some(poly => {
    return inPolygon(point, poly);
  });
}

function allCoords(g) {
  return g.type === "Polygon"
    ? g.coordinates.flat()
    : g.coordinates.flat(2);
}

/*
  Approximate score using sampled geographic overlap.
  This is a prototype, not a precise geodesic algorithm.
*/

function calculateScore() {
  const geometry = boundary.geometry;
  const points = allCoords(geometry).concat(coords);

  let minX = Infinity;
  let maxX = -Infinity;
  let minY = Infinity;
  let maxY = -Infinity;

  for (const [x, y] of points) {
    minX = Math.min(minX, x);
    maxX = Math.max(maxX, x);
    minY = Math.min(minY, y);
    maxY = Math.max(maxY, y);
  }

  const n = 170;
  const dx = (maxX - minX) / n;
  const dy = (maxY - minY) / n;

  if (dx <= 0 || dy <= 0) return 0;

  let intersection = 0;
  let union = 0;

  for (let i = 0; i < n; i++) {
    const x = minX + (i + .5) * dx;

    for (let j = 0; j < n; j++) {
      const y = minY + (j + .5) * dy;
      const p = [x, y];

      const a = inGeometry(p, geometry);
      const b = inRing(p, coords);

      const weight = Math.max(
        0,
        Math.cos(y * Math.PI / 180)
      );

      if (a || b) union += weight;
      if (a && b) intersection += weight;
    }
  }

  return union
    ? Math.max(
        0,
        Math.min(
          1000,
          Math.round(1000 * intersection / union)
        )
      )
    : 0;
}

/* SUBMIT BORDER */

el("submitBorder").onclick = () => {
  if (
    !boundaryReady ||
    !drawMode ||
    submitted ||
    coords.length < 10
  ) {
    return;
  }

  try {
    round2Score = calculateScore();
    submitted = true;
    redraw();

    [
      "submitBorder",
      "clear",
      "reset",
      "navigate",
      "draw"
    ].forEach(id => {
      el(id).disabled = true;
    });

    /* Reveal correct country outline */

    L.geoJSON(boundary, {
      style: {
        color: "#ee564a",
        weight: 3.5,
        dashArray: "7,5",
        fillColor: "#ee564a",
        fillOpacity: .12
      },
      interactive: false
    }).addTo(map);

    scoreAnimation(
      "score2Label",
      "score2Fill",
      round2Score
    );

    el("score2Note").textContent =
      `You earned ${round2Score} out of 1000 border points!`;

    el("borderResult").innerHTML =
      "<strong>Correct border revealed!</strong>" +
      "<div>Green: your drawing · " +
      "Red dashed line: actual border</div>";

    el("total").textContent =
      `Total Score: ${round1Score + round2Score} / 2000`;

    el("result").classList.add("visible");

    status("Compare your drawing with the correct border.");

  } catch (err) {
    console.error(err);

    status(
      "Unable to score this outline. Clear and try again."
    );
  }
};

/* HANDLE RESIZING */

window.addEventListener("resize", () => {
  if (map) {
    map.invalidateSize();
    resizeCanvas();
  }
});
</script>
