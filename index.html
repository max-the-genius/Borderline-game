
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Borderline</title>

  <style>

    /* MAIN WEBPAGE */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #f5f7fa;
      font-family: Arial, sans-serif;
    }

    /* MAIN CONTENT */
    .main-container {
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* LOGO AND BUTTON CONTAINER */
    .game-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: min(90vw, 420px);
      gap: 20px;
    }

    /* FLOATING GLOBE */
    .globe-logo {
      width: min(80vw, 400px);
      height: auto;
      display: block;
      animation: float 5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-20px);
      }
    }

    /*
      START / COUNTRY ANNOUNCEMENT AREA

      Both elements occupy the same position.
      Changing between them will not move the logo.
    */
    .start-area {
      position: relative;
      width: min(90vw, 360px);
      height: 110px;
      flex-shrink: 0;
    }

    /* START BUTTON */
    .image-button {
      position: absolute;
      inset: 0;
      margin: auto;

      width: 200px;
      height: 90px;

      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;

      display: flex;
      justify-content: center;
      align-items: center;

      transition: opacity 0.3s ease;
    }

    /*
      START2.PNG

      The original PNG is vertical.
      Rotate it to display horizontally.
    */
    .image-button img {
      width: 65px;
      height: auto;
      display: block;

      transform: rotate(-90deg);
      transition: transform 0.2s ease;
    }

    /* BUTTON HOVER */
    .image-button:hover img {
      transform: rotate(-90deg) scale(1.1);
    }

    /* HIDE START BUTTON */
    .image-button.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* COUNTRY ANNOUNCEMENT */
    .country-display {
      position: absolute;
      inset: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
      opacity: 0;
      visibility: hidden;

      transition: opacity 0.5s ease;
    }

    /* SHOW ANNOUNCEMENT */
    .country-display.visible {
      opacity: 1;
      visibility: visible;
    }

    .country-display h2 {
      font-size: clamp(18px, 3vw, 26px);
      color: #222;
      margin: 0;
      white-space: nowrap;
    }

    /* COUNTRY NAME */
    #countryName {
      color: #00b85b;
      font-size: clamp(26px, 4vw, 36px);
      margin: 12px 0 0;
    }

    /* COUNTRY NAME POP ANIMATION */
    #countryName.reveal {
      animation: countryPop 0.5s ease-out;
    }

    @keyframes countryPop {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* REDUCED MOTION */
    @media (prefers-reduced-motion: reduce) {
      .globe-logo,
      #countryName.reveal {
        animation: none;
      }

      .image-button,
      .image-button img,
      .country-display {
        transition: none;
      }
    }

  </style>
</head>

<body>

  <main class="main-container">

    <div class="game-header">

      <!-- FLOATING BORDERLINE LOGO -->
      <img
        src="Untitled%202.png"
        alt="Borderline Globe Logo"
        class="globe-logo"
      >

      <!-- START BUTTON / COUNTRY TEXT -->
      <div class="start-area">

        <!-- START BUTTON -->
        <button
          class="image-button"
          id="startButton"
          type="button"
          aria-label="Start Game"
        >
          <img
            src="Start2.png"
            alt=""
          >
        </button>

        <!-- COUNTRY ANNOUNCEMENT -->
        <div
          class="country-display"
          id="countryDisplay"
          aria-live="polite"
        >
          <h2>Today's country is...</h2>
          <h1 id="countryName"></h1>
        </div>

      </div>

    </div>

  </main>

  <!-- JAVASCRIPT -->
  <script>

    // Find the HTML elements
    const startButton =
      document.getElementById("startButton");

    const countryDisplay =
      document.getElementById("countryDisplay");

    const countryName =
      document.getElementById("countryName");

    // When Start is clicked
    startButton.addEventListener("click", function() {

      // Prevent clicking twice
      startButton.disabled = true;

      // Hide Start button
      startButton.classList.add("hidden");

      // Show "Today's country is..."
      countryDisplay.classList.add("visible");

      // After 1 second, reveal the country
      setTimeout(function() {

        countryName.textContent = "New Zealand";

        countryName.classList.add("reveal");

      }, 1000);

    });

  </script>

</body>
</html>
