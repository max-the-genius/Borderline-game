
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borderline</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f5f7fa;
      font-family: Arial, sans-serif;
      color: #252525;
    }

    /* SCREEN TRANSITIONS */

    .screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    #homeScreen {
      z-index: 2;
      transition: transform 1.2s ease-in-out,
                  opacity 1.2s ease-in-out;
    }

    #homeScreen.leave {
      transform: translateY(-110%);
      opacity: 0;
      pointer-events: none;
    }

    #roundScreen {
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;

      transform: translateY(110%);
      opacity: 0;
      pointer-events: none;

      transition: transform 1.2s ease-in-out,
                  opacity 1.2s ease-in-out;
    }

    #roundScreen.enter {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    /* LANDING PAGE */

    .game-header {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(65vw, 350px);
    }

    .globe-logo {
      width: 100%;
      height: auto;
      display: block;
      animation: float 5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    .start-area {
      position: absolute;
      top: 75%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(90vw, 360px);
      height: 120px;
    }

    .image-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: 200px;
      height: 90px;

      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;

      display: flex;
      justify-content: center;
      align-items: center;

      transition: opacity 0.3s ease;
    }

    .image-button img {
      width: 65px;
      height: auto;
      display: block;
      transform: rotate(-90deg);
      transition: transform 0.2s ease;
    }

    .image-button:hover img {
      transform: rotate(-90deg) scale(1.1);
    }

    .image-button.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .country-display {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: 100%;
      text-align: center;
      opacity: 0;
      visibility: hidden;

      transition: opacity 0.5s ease;
    }

    .country-display.visible {
      opacity: 1;
      visibility: visible;
    }

    .country-display h2 {
      font-size: clamp(18px, 3vw, 26px);
      margin: 0;
      white-space: nowrap;
    }

    #countryName {
      color: #00b85b;
      font-size: clamp(26px, 4vw, 36px);
      margin: 12px 0 0;
    }

    #countryName.reveal {
      animation: countryPop 0.5s ease-out;
    }

    @keyframes countryPop {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ROUND ONE LAYOUT */

    .round-layout {
      width: min(100%, 760px);
      max-height: 100%;
      overflow-y: auto;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(12px, 2.5vh, 24px);

      scrollbar-width: thin;
    }

    .round-heading {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 3vw, 28px);
      flex-shrink: 0;
    }

    /* YOUR HAND-DRAWN GLOBES */

    .mini-globe {
      width: clamp(55px, 10vw, 100px);
      height: clamp(55px, 10vw, 100px);
      object-fit: contain;
      flex-shrink: 0;

      animation: float 5s ease-in-out infinite;
    }

    .mini-globe:last-child {
      animation-delay: -2.5s;
    }

    .round-title {
      text-align: center;
    }

    .round-country {
      font-size: clamp(22px, 5vw, 40px);
      font-weight: bold;
      color: #00a955;
    }

    .round-number {
      font-size: clamp(18px, 3vw, 25px);
      margin-top: 5px;
    }

    /* QUESTION PANEL */

    .questions-panel {
      width: 100%;
      border: 2px solid #343434;
      border-radius: 12px;
      padding: clamp(16px, 4vw, 32px);
      background: white;

      display: flex;
      flex-direction: column;
      gap: clamp(14px, 2.5vh, 24px);
      flex-shrink: 0;
    }

    .question {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .question label {
      font-size: clamp(15px, 2.4vw, 21px);
      font-weight: 600;
    }

    .answer-input {
      width: 100%;
      height: 48px;

      border: 2px solid #b9c1c8;
      border-radius: 8px;

      padding: 0 14px;
      font-size: 18px;
      background: #f5f7fa;
      outline: none;
    }

    .answer-input:focus {
      border-color: #00a955;
    }

    .answer-input:disabled {
      opacity: 0.8;
    }

    /* ANSWER REVEAL */

    .answer-result {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;

      background: #eaf8ef;
      border-left: 4px solid #00b85b;

      font-size: 15px;
      line-height: 1.5;

      animation: resultAppear 0.4s ease-out;
    }

    .answer-result.visible {
      display: block;
    }

    .correct-value {
      font-weight: bold;
      color: #008b47;
    }

    .earned-points {
      font-weight: bold;
    }

    @keyframes resultAppear {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* SUBMIT BUTTON */

    .submit-button {
      align-self: center;
      background: #00b85b;
      color: white;

      font-size: 17px;
      font-weight: bold;

      padding: 13px 32px;
      border: none;
      border-radius: 9px;
      cursor: pointer;

      transition: transform 0.2s ease;
    }

    .submit-button:hover {
      transform: scale(1.05);
    }

    .submit-button:disabled {
      opacity: 0.65;
      cursor: default;
    }

    /* SCORE METER */

    .score-section {
      width: 100%;
      text-align: center;
      flex-shrink: 0;
      padding-bottom: 10px;
    }

    .score-label {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .score-track {
      width: 100%;
      height: 30px;

      border: 2px solid #343434;
      border-radius: 8px;
      overflow: hidden;
      background: #e3e8ed;
    }

    .score-fill {
      height: 100%;
      width: 0%;
      background: #00b85b;
      transition: width 1.2s ease-out;
    }

    .score-scale {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      font-size: 14px;
    }

    .score-feedback {
      min-height: 22px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: 500;
    }

    @media (max-width: 500px) {
      #roundScreen {
        padding: 12px;
      }

      .questions-panel {
        padding: 16px;
      }

      .mini-globe {
        width: 55px;
        height: 55px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .globe-logo,
      .mini-globe,
      #countryName.reveal {
        animation: none;
      }

      .screen,
      .score-fill,
      .answer-result {
        transition: none;
      }
    }

  </style>
</head>

<body>

  <!-- LANDING PAGE -->

  <main class="screen" id="homeScreen">

    <div class="game-header">
      <img
        src="Untitled%202.png"
        alt="Borderline Globe Logo"
        class="globe-logo"
      >
    </div>

    <div class="start-area">

      <button
        class="image-button"
        id="startButton"
        type="button"
        aria-label="Start Game"
      >
        <img src="Start2.png" alt="">
      </button>

      <div
        class="country-display"
        id="countryDisplay"
        aria-live="polite"
      >
        <h2>Today's country is...</h2>
        <h1 id="countryName"></h1>
      </div>

    </div>

  </main>

  <!-- ROUND ONE -->

  <section class="screen" id="roundScreen">

    <div class="round-layout">

      <!-- COUNTRY HEADING -->

      <header class="round-heading">

        <img
          src="Untitled%201.png"
          alt=""
          class="mini-globe"
        >

        <div class="round-title">
          <div class="round-country">
            New Zealand
          </div>

          <div class="round-number">
            Round 1
          </div>
        </div>

        <img
          src="Untitled%201.png"
          alt=""
          class="mini-globe"
        >

      </header>

      <!-- QUESTIONS -->

      <form class="questions-panel" id="questionsForm">

        <!-- GDP -->

        <div class="question">

          <label for="gdpAnswer">
            What is the GDP of New Zealand?
            (USD billions)
          </label>

          <input
            class="answer-input"
            id="gdpAnswer"
            type="number"
            min="0"
            step="any"
            placeholder="Type your answer here..."
            required
          >

          <div class="answer-result" id="gdpResult"></div>

        </div>

        <!-- POPULATION -->

        <div class="question">

          <label for="populationAnswer">
            What is the population of New Zealand?
            (millions)
          </label>

          <input
            class="answer-input"
            id="populationAnswer"
            type="number"
            min="0"
            step="any"
            placeholder="Type your answer here..."
            required
          >

          <div
            class="answer-result"
            id="populationResult"
          ></div>

        </div>

        <!-- COASTLINE -->

        <div class="question">

          <label for="coastlineAnswer">
            How long is the coastline of New Zealand?
            (kilometres)
          </label>

          <input
            class="answer-input"
            id="coastlineAnswer"
            type="number"
            min="0"
            step="any"
            placeholder="Type your answer here..."
            required
          >

          <div
            class="answer-result"
            id="coastlineResult"
          ></div>

        </div>

        <button
          class="submit-button"
          type="submit"
        >
          Submit Answers
        </button>

      </form>

      <!-- SCORE METER -->

      <div class="score-section">

        <div class="score-label" id="scoreLabel">
          0 / 1000 Points
        </div>

        <div class="score-track">
          <div
            class="score-fill"
            id="scoreFill"
          ></div>
        </div>

        <div class="score-scale">
          <span>0</span>
          <span>1000</span>
        </div>

        <div
          class="score-feedback"
          id="scoreFeedback"
          aria-live="polite"
        ></div>

      </div>

    </div>

  </section>

  <script>

    // LANDING PAGE

    const startButton =
      document.getElementById("startButton");

    const countryDisplay =
      document.getElementById("countryDisplay");

    const countryName =
      document.getElementById("countryName");

    const homeScreen =
      document.getElementById("homeScreen");

    const roundScreen =
      document.getElementById("roundScreen");

    startButton.addEventListener("click", function() {

      startButton.blur();
      startButton.disabled = true;
      startButton.classList.add("hidden");

      countryDisplay.classList.add("visible");

      setTimeout(function() {
        countryName.textContent = "New Zealand";
        countryName.classList.add("reveal");
      }, 1000);

      setTimeout(function() {
        homeScreen.classList.add("leave");
        roundScreen.classList.add("enter");
      }, 2800);

    });

    // ROUND DATA
    // Prototype values: verify and date before launch.

    const correctAnswers = {
      gdp: 260,
      population: 5.3,
      coastline: 15134
    };

    // Each question contributes to a total of 1000 points.

    const MAX_ROUND_POINTS = 1000;

    function calculateAccuracy(guess, actual) {

      const difference = Math.abs(guess - actual);

      const relativeError = difference / actual;

      return Math.max(0, 1 - relativeError);

    }

    // SCORE COUNTER ANIMATION

    function animateScore(finalScore) {

      const scoreLabel =
        document.getElementById("scoreLabel");

      const duration = 1200;
      const startTime = performance.now();

      function updateScore(currentTime) {

        const elapsed = currentTime - startTime;

        const progress = Math.min(elapsed / duration, 1);

        const easedProgress =
          1 - Math.pow(1 - progress, 3);

        const currentScore =
          Math.round(finalScore * easedProgress);

        scoreLabel.textContent =
          currentScore + " / 1000 Points";

        if (progress < 1) {
          requestAnimationFrame(updateScore);
        }

      }

      requestAnimationFrame(updateScore);

    }

    // DISPLAY CORRECT ANSWERS

    function showAnswerResult(
      elementId,
      correctValue,
      unit,
      points,
      maximum
    ) {

      const resultElement =
        document.getElementById(elementId);

      resultElement.innerHTML =
        '<div>Correct answer: ' +
        '<span class="correct-value">' +
        correctValue + ' ' + unit +
        '</span></div>' +
        '<div>Points earned: ' +
        '<span class="earned-points">' +
        points + ' / ' + maximum +
        '</span></div>';

      resultElement.classList.add("visible");

    }

    // HANDLE SUBMISSION

    const questionsForm =
      document.getElementById("questionsForm");

    questionsForm.addEventListener("submit", function(event) {

      event.preventDefault();

      const gdpGuess =
        Number(document.getElementById("gdpAnswer").value);

      const populationGuess =
        Number(document.getElementById("populationAnswer").value);

      const coastlineGuess =
        Number(document.getElementById("coastlineAnswer").value);

      // Calculate accuracy

      const gdpAccuracy =
        calculateAccuracy(gdpGuess, correctAnswers.gdp);

      const populationAccuracy =
        calculateAccuracy(
          populationGuess,
          correctAnswers.population
        );

      const coastlineAccuracy =
        calculateAccuracy(
          coastlineGuess,
          correctAnswers.coastline
        );

      // Distribute 1000 points across three questions
      // 334 + 333 + 333 = 1000

      const gdpPoints =
        Math.round(gdpAccuracy * 334);

      const populationPoints =
        Math.round(populationAccuracy * 333);

      const coastlinePoints =
        Math.round(coastlineAccuracy * 333);

      const totalPoints =
        gdpPoints + populationPoints + coastlinePoints;

      // Reveal correct answers

      showAnswerResult(
        "gdpResult",
        correctAnswers.gdp,
        "billion USD",
        gdpPoints,
        334
      );

      showAnswerResult(
        "populationResult",
        correctAnswers.population,
        "million",
        populationPoints,
        333
      );

      showAnswerResult(
        "coastlineResult",
        correctAnswers.coastline.toLocaleString(),
        "km",
        coastlinePoints,
        333
      );

      // Animate score counter

      animateScore(totalPoints);

      // Fill score meter

      document.getElementById("scoreFill").style.width =
        (totalPoints / MAX_ROUND_POINTS * 100) + "%";

      // Feedback

      document.getElementById("scoreFeedback").textContent =
        "You earned " + totalPoints +
        " out of 1000 points in Round 1!";

      // Lock answers after submission

      const inputs =
        questionsForm.querySelectorAll("input");

      inputs.forEach(function(input) {
        input.disabled = true;
      });

      questionsForm.querySelector("button").disabled = true;

    });

  </script>

</body>
</html>
