
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Borderline</title>

  <style>

    /* Main webpage */
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #f5f7fa;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Holds the logo and Start button */
    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    /* Borderline globe logo */
    .globe-logo {
      width: min(80vw, 400px);
      height: auto;
      display: block;

      animation: float 5s ease-in-out infinite;
    }

    /* Floating animation */
    @keyframes float {
      0% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-20px);
      }

      100% {
        transform: translateY(0);
      }
    }

    .game-header {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 25px;

  transition: top 1s ease;
}

    .game-header.move-up {
  top: 25%;
}

  /* Start button */
.image-button {
  background: transparent;
  border: none;
  padding: 0;
  cursor: pointer;

  display: flex;
  justify-content: center;
  align-items: center;
}

/* Start button image */
.image-button img {
  width: 180px;
  height: auto;
  display: block;

  transition: transform 0.2s ease;
}

/* Hover animation */
.image-button:hover img {
  transform: scale(1.1);
}

    .country-display {
  position: absolute;
  top: 65%;
  left: 50%;
  transform: translate(-50%, 20px);

  width: 90%;
  text-align: center;
  opacity: 0;

  transition: opacity 0.5s ease,
              transform 0.5s ease;
}

.country-display.visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

#countryName {
  color: #00b85b;
  font-size: 36px;
}

    /* Button hover animation */
    .image-button:hover img {
      scale: 1.1;
    }

    /* Reduce animations when requested */
    @media (prefers-reduced-motion: reduce) {
      .globe-logo {
        animation: none;
      }

      .image-button img {
        transition: none;
      }
    }

  </style>
</head>

<body>

  <main class="main-container">
    <div class="game-header" id="gameHeader">

    <!-- Floating globe logo -->
      <img
        src="Untitled%202.png"
        alt="Borderline Globe Logo"
        class="globe-logo"
      > 

    <!-- Start button -->
    <button
      class="image-button"
      type="button"
      id="startButton"
      aria-label="Start Game"
    >
      <img
        src="Start2.png"
        alt=""
      >
    </button>
    </div>

    <div class="country-display" id="countryDisplay">
      <h2>Today's country is...</h2>
      <h1 id="countryName"></h1>
    </div>

  </main>
<script>
  const startButton = document.getElementById("startButton");
  const gameHeader = document.getElementById("gameHeader");
  const countryDisplay = document.getElementById("countryDisplay");
  const countryName = document.getElementById("countryName");

  startButton.addEventListener("click", function() {

    // Move logo and button upward
    gameHeader.classList.add("move-up");

    // Hide the Start button
    startButton.style.visibility = "hidden";

    // Display the introductory text after 1 second
    setTimeout(function() {
      countryDisplay.classList.add("visible");
    }, 1000);

    // Display the country name 1 second later
    setTimeout(function() {
      countryName.textContent = "New Zealand";
    }, 2000);

  });
</script>
</body>
</html>
